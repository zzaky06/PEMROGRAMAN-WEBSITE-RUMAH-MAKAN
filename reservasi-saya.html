<script>
document.getElementById('btnReservasi').addEventListener('click', function() {
    alert('Kamu akan diarahkan ke halaman reservasi!');
    window.location.href = 'form-reservasi.html';
});

window.addEventListener('DOMContentLoaded', function() {
    const dataArray = JSON.parse(localStorage.getItem('reservasiDataArray')) || [];

    if (dataArray.length > 0) {
        const container = document.getElementById('container-card');
        const btnReservasi = document.querySelector('.btn-reservasi');
        const containerTeks = document.querySelector('.container-teks');

        dataArray.forEach(data => {
            container.innerHTML += `
                <div class="card">
                    <div class="head">
                        <img src="logo.png" alt="">
                    </div>
                    <div class="info">
                        <p id="Tanggal">${data.tanggal}</p>
                        <p id="Nama">Nama : <span>${data.nama}</span></p>
                        <p id="HP">HP : <span>${data.hp}</span></p>
                        <p id="jt">Jumlah Tamu : <span>${data.jumlah}</span></p>
                        <p id="jk">Jam Kedatangan : <span>${data.jam}</span></p>
                        <p id="catatan">Catatan : <span>${data.catatan}</span></p>
                        <div class="button-info">
                            <button class="batalkan" id = "batalkan">Batalkan</button>
                            <button class="btn-selesai" id = "btn-selesai">Selesai</button>
                        </div>
                    </div>
                </div>
            `;
        });

        btnReservasi.style.display = "flex";
        containerTeks.style.display = "none";
    }
});

const selesai = document.getElementById('selesai');
const berlangsung = document.getElementById('berlangsung');
berlangsung.classList.add('active-btn');

berlangsung.addEventListener('click', function(){
    berlangsung.classList.add('active-btn');
    selesai.classList.remove('active-btn');

    document.getElementById('container-card-selesai').style.display = 'flex';
    document.getElementById('container-card').style.display = 'none';
});

selesai.addEventListener('click', function(){
    selesai.classList.add('active-btn');
    berlangsung.classList.remove('active-btn');

    document.getElementById('container-card').style.display = 'flex';
    document.getElementById('container-card-selesai').style.display = 'none';
});
selesai.addEventListener('click', function(){
    document.getElementById('container-card-selesai').style.display = 'flex';
    document.getElementById('container-card').style.display = 'none';
});
berlangsung.addEventListener('click', function(){
    document.getElementById('container-card').style.display = 'flex';
    document.getElementById('container-card-selesai').style.display = 'none';
});

// Fungsi popup konfirmasi custom
function showPopupConfirm(message, onConfirm) {
    const popup = document.createElement('div');
    popup.innerHTML = `
        <div class="popup-overlay"></div>
        <div class="popup-box">
            <p>${message}</p>
            <div class="popup-buttons">
                <button id="popupCancel">Tidak</button>
                <button id="popupOk">Ya</button>
            </div>
        </div>
    `;
    document.body.appendChild(popup);

    // Event tombol
    document.getElementById('popupCancel').onclick = () => popup.remove();
    document.getElementById('popupOk').onclick = () => {
        popup.remove();
        onConfirm();
    };
}

document.addEventListener('click', function(e) {
    if (e.target.classList.contains('batalkan')) {
        const card = e.target.closest('.card');
        showPopupConfirm("Yakin mau batalkan reservasi ini?", () => {
            const index = Array.from(card.parentNode.children).indexOf(card);
            card.remove();

            // Hapus data dari localStorage
            let dataArray = JSON.parse(localStorage.getItem('reservasiDataArray')) || [];
            dataArray.splice(index, 1);
            localStorage.setItem('reservasiDataArray', JSON.stringify(dataArray));
        });
    }

    if (e.target.classList.contains('btn-selesai')) {
        const card = e.target.closest('.card');
        const selesaiContainer = document.getElementById('container-card-selesai');
        const berlangsungContainer = document.getElementById('container-card');

        if (card) {
            berlangsungContainer.removeChild(card);
            selesaiContainer.appendChild(card);

            const btnGroup = card.querySelector('.button-info');
            if (btnGroup) {
                btnGroup.innerHTML = `<span style="color:green;font-weight:bold;font-family:'Raleway';">✔️ Reservasi Selesai</span>`;
            }
        }
    }
});
